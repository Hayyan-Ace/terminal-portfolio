<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAYYAN_OS v4.2.1</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04080A;--ph:#2AFF80;--ph-dim:#0E7A3C;--amber:#FFB000;--red:#FF4B4B;--cyan:#4BE8FF;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ph);font-family:var(--mono);font-size:14px;overflow:hidden}
::selection{background:var(--ph);color:#000}

/* CRT effects */
.crt{position:fixed;inset:0;pointer-events:none;z-index:9999}
.crt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.flicker{position:fixed;inset:0;pointer-events:none;background:rgba(42,255,128,.018);z-index:9998;animation:flick 4s infinite}
@keyframes flick{0%,94%,100%{opacity:1}95%{opacity:.55}96%{opacity:1}97%{opacity:.7}}

/* boot screen */
#boot{position:fixed;inset:0;background:var(--bg);z-index:500;padding:5vh 5vw;overflow:hidden}
#boot pre{white-space:pre-wrap;text-shadow:0 0 6px rgba(42,255,128,.6);line-height:1.7;font-size:13px}
#boot .ok{color:var(--ph)} #boot .warn{color:var(--amber)} #boot .info{color:var(--ph-dim)}
.skip{position:fixed;bottom:20px;right:24px;color:var(--ph-dim);font-size:11px;letter-spacing:.2em;cursor:pointer;border:1px solid var(--ph-dim);padding:8px 14px;background:none;font-family:var(--mono)}
.skip:hover{color:var(--ph);border-color:var(--ph)}

/* desktop */
#desktop{position:fixed;inset:0;display:none;padding:44px 18px 60px}
.topbar{position:fixed;top:0;left:0;right:0;height:34px;background:rgba(4,8,10,.95);border-bottom:1px solid var(--ph-dim);
  display:flex;align-items:center;padding:0 16px;gap:20px;font-size:11.5px;z-index:400;text-shadow:0 0 6px rgba(42,255,128,.5)}
.topbar .t{margin-left:auto;color:var(--ph-dim)}
.topbar b{color:var(--amber)}
.topbar .m{cursor:pointer;color:var(--ph-dim)} .topbar .m:hover{color:var(--ph)}

/* windows */
.win{position:absolute;background:rgba(4,10,8,.96);border:1px solid var(--ph);box-shadow:0 0 30px rgba(42,255,128,.12), inset 0 0 60px rgba(42,255,128,.03);
  min-width:300px;display:flex;flex-direction:column;z-index:10}
.win.active{z-index:100;box-shadow:0 0 40px rgba(42,255,128,.25)}
.win-head{background:var(--ph);color:#04220E;padding:6px 12px;font-weight:800;font-size:12px;letter-spacing:.1em;
  display:flex;justify-content:space-between;cursor:grab;user-select:none;text-transform:uppercase}
.win-head:active{cursor:grabbing}
.win-head .x{cursor:pointer;padding:0 6px}
.win-body{padding:16px 18px;overflow-y:auto;flex:1;line-height:1.75;font-size:13px;text-shadow:0 0 5px rgba(42,255,128,.4)}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--ph-dim)}
.win-body h3{color:var(--amber);font-size:13px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.1em}
.win-body h3:first-child{margin-top:0}
.win-body .dim{color:var(--ph-dim)}
.win-body .cy{color:var(--cyan)}
.win-body a{color:var(--cyan)}
.win-body table{border-collapse:collapse;width:100%;margin:8px 0}
.win-body td{border:1px solid var(--ph-dim);padding:5px 10px;font-size:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin:3px 0}
.bar-row .lb{width:190px;flex-shrink:0;font-size:12px}
.bar-row .br{color:var(--ph)}

/* terminal */
#term-out{white-space:pre-wrap;word-break:break-word}
#term-out .cmd-echo{color:var(--amber)}
#term-out .err{color:var(--red)}
.prompt-line{display:flex;gap:8px;margin-top:4px}
.prompt-line .ps1{color:var(--amber);white-space:nowrap}
#term-in{background:none;border:none;outline:none;color:var(--ph);font-family:var(--mono);font-size:13px;flex:1;text-shadow:0 0 5px rgba(42,255,128,.4)}
.cursor{display:inline-block;width:8px;height:14px;background:var(--ph);animation:blink 1s steps(1) infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}

/* architecture diagram */
.arch-svg{width:100%;height:auto;display:block;margin:4px 0 10px}
.a-box{fill:rgba(42,255,128,.04);stroke:var(--ph);stroke-width:1.2}
.a-amb{fill:rgba(255,176,0,.05);stroke:var(--amber);stroke-width:1.2}
.a-dyn{fill:rgba(75,232,255,.05);stroke:var(--cyan);stroke-width:1.2}
.a-out{fill:rgba(42,255,128,.1);stroke:var(--ph);stroke-width:1.6}
.a-t{fill:var(--ph);font:700 11px var(--mono)}
.a-ta{fill:var(--amber);font:700 11px var(--mono)}
.a-tc{fill:var(--cyan);font:700 11px var(--mono)}
.a-s{fill:var(--ph-dim);font:400 9.5px var(--mono)}
.a-sc{fill:var(--cyan);font:400 9.5px var(--mono);opacity:.85}
.a-ln{fill:none;stroke:var(--ph);stroke-width:1.2}
.a-lc{fill:none;stroke:var(--cyan);stroke-width:1.2}
.a-flow{stroke-dasharray:5 5;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-10}}
.a-n{fill:#04220E;font:800 9px var(--mono)}
.a-nb{fill:var(--amber)}
.seq{margin-top:4px}
.seq div{margin:2px 0}
.seq b{color:var(--amber)}

/* dock */
.dock{position:fixed;bottom:0;left:0;right:0;height:46px;background:rgba(4,8,10,.95);border-top:1px solid var(--ph-dim);
  display:flex;align-items:center;gap:8px;padding:0 14px;z-index:400;overflow-x:auto}
.dock button{background:none;border:1px solid var(--ph-dim);color:var(--ph-dim);font-family:var(--mono);font-size:11px;
  padding:7px 14px;cursor:pointer;letter-spacing:.1em;white-space:nowrap;text-transform:uppercase}
.dock button:hover,.dock button.open{color:var(--ph);border-color:var(--ph);text-shadow:0 0 6px rgba(42,255,128,.6)}

@media(max-width:760px){
  .win{position:fixed!important;inset:44px 8px 56px 8px!important;width:auto!important;height:auto!important}
  body{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

function finishBoot(){

let zTop=100, openWins={};
function mkWin(id,title,html,x,y,w,h){
  if(openWins[id]){focusWin(openWins[id]);return}
  const el=document.createElement('div');
  el.className='win';el.style.left=Math.min(x,innerWidth-320)+'px';el.style.top=y+'px';
  el.style.width=w+'px';el.style.height=h+'px';
  el.innerHTML=`<div class="win-head"><span>▓ ${title}</span><span class="x" title="close">[X]</span></div><div class="win-body">${html}</div>`;
  desktop.appendChild(el);openWins[id]=el;
  el.querySelector('.x').onclick=()=>{el.remove();delete openWins[id];syncDock()};
  el.addEventListener('mousedown',()=>focusWin(el));
  // drag
  const head=el.querySelector('.win-head');
  head.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('x'))return;
    focusWin(el);
    const sx=e.clientX-el.offsetLeft, sy=e.clientY-el.offsetTop;
    const mv=ev=>{el.style.left=Math.max(0,ev.clientX-sx)+'px';el.style.top=Math.max(34,ev.clientY-sy)+'px'};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
  focusWin(el);syncDock();
  return el;
}
function focusWin(el){document.querySelectorAll('.win').forEach(w=>w.classList.remove('active'));el.classList.add('active');el.style.zIndex=++zTop}
function syncDock(){document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('open',!!openWins[b.dataset.app]))}

  };
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const c=inp.value.trim();inp.value='';
    out.innerHTML+=`<span class="cmd-echo">hayyan@prod:~$ ${c.replace(/</g,'&lt;')}</span>\n`;
    if(c){
      const fn=cmds[c.toLowerCase()];
      if(fn){const r=fn();if(r!==null)out.innerHTML+=r.replace(/</g,'&lt;').replace(/&lt;span/g,'<span')+'\n';}
      else out.innerHTML+=`<span class="err">command not found: ${c.replace(/</g,'&lt;')}</span> — try 'help'\n`;
    }
    body.scrollTop=body.scrollHeight;
  });
}
</script>
</body>
</html>
